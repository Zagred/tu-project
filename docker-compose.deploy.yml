name: bankapp

services:
  bankapi:
    image: "${BANKAPP_API_IMAGE}"
    container_name: bankapp-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:7083
      DOTNET_PRINT_TELEMETRY_MESSAGE: "false"
      ConnectionStrings__DefaultConnection: "${BANKAPP_DB_CONNECTION_STRING:?BANKAPP_DB_CONNECTION_STRING is required}"
      Ollama__BaseAddress: "${BANKAPP_OLLAMA_BASE_ADDRESS:-http://host.docker.internal:11434/}"
      EmailSettings__SmtpServer: "${BANKAPP_EMAIL_SMTP_SERVER:-smtp.gmail.com}"
      EmailSettings__Port: "${BANKAPP_EMAIL_PORT:-587}"
      EmailSettings__SenderName: "${BANKAPP_EMAIL_SENDER_NAME:-BankAPP}"
      EmailSettings__SenderEmail: "${BANKAPP_EMAIL_SENDER_EMAIL:-}"
      EmailSettings__Username: "${BANKAPP_EMAIL_USERNAME:-}"
      EmailSettings__Password: "${BANKAPP_EMAIL_PASSWORD:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7083:7083"
    volumes:
      - bankapi-data-protection:/root/.aspnet/DataProtection-Keys

  bankweb:
    image: "${BANKAPP_WEB_IMAGE}"
    container_name: bankapp-web
    restart: unless-stopped
    depends_on:
      - bankapi
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000
      DOTNET_PRINT_TELEMETRY_MESSAGE: "false"
      BankApi__BaseAddress: "${BANKAPP_API_BASE_ADDRESS:-http://bankapi:7083/}"
    ports:
      - "5000:5000"
    volumes:
      - bankweb-data-protection:/root/.aspnet/DataProtection-Keys

volumes:
  bankapi-data-protection:
  bankweb-data-protection:
